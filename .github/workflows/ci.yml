name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    name: validate (${{ matrix.runtime }}, Node ${{ matrix.node }})
    strategy:
      matrix:
        node: [22, 24]
        runtime: ['0.2.0-rc.2', '0.2.1-alpha.1']
    runs-on: ubuntu-latest
    env:
      DSH_TEST_VERSION: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            test/fixtures/pnpm-lock.rc2.yaml
      - run: node scripts/select-test-runtime.mjs "$DSH_TEST_VERSION"
      - if: matrix.runtime == '0.2.0-rc.2'
        run: cp test/fixtures/pnpm-lock.rc2.yaml pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm peers check
      - run: pnpm check
      - run: npm pack --dry-run
